name: OrthanC DICOMweb CI

on:
  push:
    paths:
      - "infrastructure/orthanc/**"
      - "tests/integration/**"
      - "requirements-test.txt"
      - ".github/workflows/orthanc-ci.yml"
  pull_request:
  workflow_dispatch:

jobs:
  orthanc-integration:
    runs-on: ubuntu-24.04

    env:
      ORTHANC_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Validate Docker Compose
        working-directory: infrastructure/orthanc
        run: docker compose config --quiet
      
      - name: Start OrthanC
        working-directory: infrastructure/orthanc
        run: docker compose up -d
      
      - name: Wait for OrthanC
        run: |
          for i in {1..30}; do
            if curl --silent --fail \
              -u "medimaging:${ORTHANC_PASSWORD}" \
              http://localhost:8042/system > /dev/null; then
              echo "OrthanC is ready"
              exit 0
            fi
            sleep 2
          done
          echo "OrthanC failed to start"
          exit 1

      - name: Check authentication
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8042/system)
          test "$status" = "401"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Test DICOMweb upload, search, and retrieval
        run: python tests/integration/test_dicomweb.py

      - name: Show Orthanc logs if failure
        if: failure()
        working-directory: infrastructure/orthanc
        run: docker compose logs --tail=100

      - name: Stop OrthanC
        if: always()
        working-directory: infrastructure/orthanc
        run: docker compose down -v
